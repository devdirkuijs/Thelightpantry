name: Assemble upload parts
on:
  push:
    branches: ['cursor/site-audit-capture-slice-9ded']
    paths:
      - 'lightpantry-github/.assemble/READY.json'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/site-audit-capture-slice-9ded
          fetch-depth: 0
      - name: Fetch verified files and commit
        env:
          INDEX_MSG: Harden contact form, Netlify Forms, SEO, and replace Wix assets
          SVG_MSG: Add optimized about portrait (SVG-wrapped JPEG, replaces multi-MB Wix CDN)
          INDEX_URL: https://litter.catbox.moe/3zldsg.html
          SVG_URL: https://litter.catbox.moe/riiddh.svg
          INDEX_SHA256: 9d9b718443c52a5da9e77d79f4f28a5ee9ef7ff6edbad163b490323ecb8b3cd8
          SVG_SHA256: 20a55e0e9ee1ec508df00ef132f0b36ab49fd62088d3281d1bc6994646e9dd0e
        run: |
          set -euo pipefail
          git config user.name "devdirkuijs"
          git config user.email "dirkuijs.dev@gmail.com"

          curl -fsSL "$INDEX_URL" -o lightpantry-github/index.html
          curl -fsSL "$SVG_URL" -o /tmp/about-jonelle.svg
          mkdir -p lightpantry-github/images
          mv /tmp/about-jonelle.svg lightpantry-github/images/about-jonelle.svg

          echo "$INDEX_SHA256  lightpantry-github/index.html" | sha256sum -c -
          echo "$SVG_SHA256  lightpantry-github/images/about-jonelle.svg" | sha256sum -c -

          # Marker checks for index.html
          grep -q 'handleContactSubmit' lightpantry-github/index.html
          grep -q 'data-netlify' lightpantry-github/index.html
          grep -q 'thelightpantry.co.za' lightpantry-github/index.html
          grep -q 'about-jonelle.svg' lightpantry-github/index.html
          ! grep -q 'wixstatic' lightpantry-github/index.html
          ! grep -q 'www.thelightpantry.com' lightpantry-github/index.html

          git add lightpantry-github/index.html
          if ! git diff --cached --quiet; then
            git commit -m "$INDEX_MSG"
          fi
          git add lightpantry-github/images/about-jonelle.svg
          if ! git diff --cached --quiet; then
            git commit -m "$SVG_MSG"
          fi
          if [ -d lightpantry-github/.assemble ]; then
            rm -rf lightpantry-github/.assemble
            git add -A lightpantry-github/.assemble || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove assemble parts after upload"
            fi
          fi
          git push origin HEAD:cursor/site-audit-capture-slice-9ded
