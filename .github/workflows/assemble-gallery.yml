name: Assemble gallery patch
on:
  push:
    branches: ['cursor/gallery-design-polish-5fad']
    paths:
      - 'lightpantry-github/.assemble/READY.json'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/gallery-design-polish-5fad
      - name: Apply patch and commit
        run: |
          set -euo pipefail
          git config user.name "devdirkuijs"
          git config user.email "dirkuijs.dev@gmail.com"
          cat lightpantry-github/.assemble/patch.part.* > /tmp/gallery.patch
          echo "9ed692a695c022e82742117e2ab0ce0af08a6099461f0f6e4a43d00c825bf840  /tmp/gallery.patch" | sha256sum -c -
          git apply /tmp/gallery.patch
          echo "04b40d91225657bba933efd1e535da3d4cbd6ebceee104834e3cf2eb66fcd005  lightpantry-github/index.html" | sha256sum -c -
          grep -q 'portfolio-frame' lightpantry-github/index.html
          grep -q 'gallery-photo--feature' lightpantry-github/index.html
          grep -q 'lightbox-caption' lightpantry-github/index.html
          grep -q 'handleContactSubmit' lightpantry-github/index.html
          git add lightpantry-github/index.html
          git commit -m "Polish portfolio gallery UX for a more editorial feel"
          rm -rf lightpantry-github/.assemble
          rm -f .github/workflows/assemble-gallery.yml
          git add -A lightpantry-github/.assemble .github/workflows/assemble-gallery.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary gallery assemble workflow"
          fi
          git push origin HEAD:cursor/gallery-design-polish-5fad
